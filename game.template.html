<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<!-- iOS：双击运行本地 HTML 时按 web app 处理，避免地址栏挤压画面 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04030a">
<title>独修者的烛火 · The Solitary Lantern</title>
<style>
  :root {
    color-scheme: dark;
    /* 刘海屏 / 手势条：把画面避让出去，不然横屏时按钮会被挖孔盖住 */
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; background: #04030a;
    font-family: "SimHei", "Microsoft YaHei", sans-serif;
    /* 手机上要禁掉这一堆默认手势，否则点按钮会被当成滚动/缩放 */
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #16102e 0%, #0a0716 52%, #030208 100%);
    padding: calc(var(--safe-t) + 2px) calc(var(--safe-r) + 2px) calc(var(--safe-b) + 2px) calc(var(--safe-l) + 2px);
    box-sizing: border-box;
  }
  /* 画面外圈：像一台老显示器。手机竖屏时这圈边框会吃掉宝贵的宽度，自动收窄 */
  #bezel {
    padding: 6px; border-radius: 4px;
    background: linear-gradient(#221a3c, #100c1e);
    box-shadow: 0 0 0 1px #342a55, 0 24px 80px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.05);
    display: flex;
  }
  #screen {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block; cursor: pointer; touch-action: none;
    background: #06050d;
  }
  /* 手机横屏高度很紧：画框那圈内边距与阴影要收窄，把像素留给画面 */
  @media (max-height: 480px) {
    #bezel { padding: 2px; border-radius: 2px; }
  }
  /* 竖屏时提示转横屏：16:9 的画面在竖屏手机上只有很窄一条，几乎没法读 */
  #rotate {
    position: fixed; inset: 0; z-index: 30; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: rgba(4,3,10,0.96); color: #c3b6e4; letter-spacing: 4px; font-size: 15px;
    padding: 24px; text-align: center; line-height: 1.9;
  }
  #rotate .ph {
    width: 54px; height: 92px; border: 2px solid #6b5aa6; border-radius: 8px;
    animation: rot 1.8s ease-in-out infinite;
  }
  @keyframes rot {
    0%, 35% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(-90deg); }
  }
  #rotate b { color: #e0b545; font-weight: normal; }
  /* 只在"竖屏且屏幕很窄"时提示，平板竖屏仍能玩 */
  @media (orientation: portrait) and (max-width: 620px) {
    #rotate { display: flex; }
  }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center;
    color: #c3b6e4; letter-spacing: 6px; font-size: 14px; background: #04030a; z-index: 20;
  }
  #loading .bar { width: 180px; height: 3px; background: #1d1735; overflow: hidden; }
  #loading .bar i { display: block; width: 40%; height: 100%; background: #e0b545;
    animation: sl 1.1s ease-in-out infinite; }
  @keyframes sl { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
</style>
</head>
<body>
<div id="wrap"><div id="bezel"><canvas id="screen" width="480" height="270"></canvas></div></div>
<div id="rotate">
  <div class="ph"></div>
  <div>请把设备<b>横过来</b>游玩</div>
  <div style="font-size:12px;letter-spacing:2px;opacity:.7">这个游戏是 16:9 的横屏画面<br>竖屏下字会小到看不清</div>
</div>
<div id="loading"><span>正在绘制……</span><span class="bar"><i></i></span></div>

<!-- 必须用经典 script：file:// 下 ES module 会被 CORS 拦掉，游戏整个打不开。 -->
<script src="src/art-data.js"></script>
<script src="src/font-data.js"></script>
<script src="src/audio.js"></script>
<script src="src/music.js"></script>
<script src="src/art.js"></script>
<!--STORY-->
<script src="src/ui.js"></script>
<script src="src/engine.js"></script>
<script>
  (function () {
    function start() {
      Art.loadImages(ART_DATA, function (failed) {
        if (failed && failed.length) console.warn('这些图没能载入：', failed);
        Art.PixelFont.load(typeof FONT_DATA !== 'undefined' ? FONT_DATA : null, function () {
          try { Sound.init(); } catch (e) { console.warn('音频初始化失败（不影响游玩）', e); }
          try { Game.boot(); } catch (e) {
            console.error(e);
            var el = document.getElementById('loading');
            if (el) { el.style.display = 'flex'; el.firstChild.textContent = '启动失败：' + e.message; }
          }
        });
      });
    }
    // 音频上下文必须等用户手势；先挂一次性监听
    function gesture() {
      try { Sound.init(); } catch (e) {}
      window.removeEventListener('keydown', gesture);
      window.removeEventListener('pointerdown', gesture);
    }
    window.addEventListener('keydown', gesture);
    window.addEventListener('pointerdown', gesture);
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
</script>
</body>
</html>
