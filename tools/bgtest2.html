<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>季节背景一览</title>
<style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="540"></canvas>
<script src="../src/art-data.js"></script>
<script src="../src/art.js"></script>
<script>
Art.loadImages(ART_DATA, function () {
  var out = document.getElementById('c').getContext('2d');
  var names = ['winter','yule','rainy','spring','beltane','midsummer','harvest','samhain'];
  var tmp = document.createElement('canvas'); tmp.width = 480; tmp.height = 270;
  var tc = tmp.getContext('2d'); tc.imageSmoothingEnabled = false;
  names.forEach(function (n, i) {
    tc.clearRect(0, 0, 480, 270);
    Art.paintBackground(tc, n, 12.3);
    var x = (i % 4) * 480, y = Math.floor(i / 4) * 270;
    out.drawImage(tmp, x, y);
    out.fillStyle = 'rgba(0,0,0,0.6)'; out.fillRect(x + 4, y + 4, 96, 16);
    out.fillStyle = '#ffdf8e'; out.font = '12px monospace'; out.fillText(n, x + 8, y + 16);
  });
});
</script></body></html>
