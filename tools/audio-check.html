<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>audio-check · 波形</title>
<style>body{background:#0b0a14;color:#cfc8e8;font:12px/1.6 Consolas,monospace;margin:0;padding:10px}
pre#log{white-space:pre-wrap;margin:0}.ok{color:#7fd18a}.bad{color:#ff7b7b}.warn{color:#e0b545}</style>
</head>
<body>
<pre id="log">running…</pre>
<script>
/* 音频验证：把每条配乐、每个音效渲染成 PCM，量峰值 / RMS，并带"什么都不播"的基准线。
 *
 * 为什么不用 OfflineAudioContext（本项目的实测结论，别照抄 skill 模板）：
 * Chromium 无头下，一条轨道排到 4 小节（上百个带周期波的振荡器）时
 * startRendering() 会永远停在 state='running'；1 小节 23ms 却正常。
 * --headless=old / new、--mute-audio、--disable-features=AudioServiceOutOfProcess 都试过，一样卡。
 * 所以这里改成**确定性的 PCM 模型**：谱面数据与音效配方**从 src/audio.js 原文解析**，
 * 合成与包络按 audio.js 的 note()/schedule()/cues 逐行等价实现，再逐样本混音。
 * 它证明的是"排出来的谱面真的有声音、音量为正、基准线严格为 0"，
 * 不证明浏览器 DSP 的实现 —— 报告里会写明这一点。
 */
var CONFIG = { target: '../src/audio.js', sr: 22050, musicSeconds: 6, sfxSeconds: 2 };
var log = document.getElementById('log');
var out = [];
function say(s) { out.push(s); log.textContent = out.join('\n'); }

function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
var CHORDS = {
  C: [48, 55, 60, 64], Am: [45, 52, 57, 60], F: [41, 48, 57, 60], G: [43, 50, 55, 59],
  Dm: [50, 57, 62, 65], Em: [40, 47, 55, 59], D: [50, 57, 62, 66], Bm: [47, 54, 59, 62]
};
/* 与 audio.js 的 waves.harp / waves.flute 一致：三角级数（前几阶谐波） */
function waveSample(kind, ph) {
  if (kind === 'flute') return Math.sin(ph) + .10 * Math.sin(2 * ph) + .06 * Math.sin(3 * ph) + .015 * Math.sin(4 * ph);
  return Math.sin(ph) + .24 * Math.sin(2 * ph) + .10 * Math.sin(3 * ph) + .035 * Math.sin(4 * ph) + .012 * Math.sin(5 * ph);
}
/* note()：包络与 audio.js 一致
 *  harp : setValueAtTime(0, when) → linearRamp(amp, when+0.016) → exponentialRamp(0.0001, when+max(.08,dur)) → linearRamp(0, when+dur+.04)
 *  flute: linearRamp(amp, when+0.12) → linearRamp(amp*.78, when+max(.12,dur*.65)) → linearRamp(0, when+dur+.20) */
function envAt(kind, t, t0, dur, amp) {
  var u = t - t0;
  if (u < 0) return 0;
  if (kind === 'flute') {
    var a = 0.12, hold = Math.max(a, dur * 0.65), end = dur + 0.20;
    if (u < a) return amp * (u / a);
    if (u < hold) return amp * (1 + (0.78 - 1) * ((u - a) / Math.max(1e-6, hold - a)));
    if (u < end) return amp * 0.78 * (1 - (u - hold) / Math.max(1e-6, end - hold));
    return 0;
  }
  var a2 = 0.016, e2 = Math.max(0.08, dur);
  if (u < a2) return amp * (u / a2);
  if (u < e2) return amp * Math.pow(0.0001 / amp, (u - a2) / Math.max(1e-6, e2 - a2));
  if (u < dur + 0.04) return amp * 0.0001 * (1 - (u - e2) / Math.max(1e-6, dur + 0.04 - e2));
  return 0;
}
/* 把一条谱面渲染成单声道 PCM（同时算左右两路，声像用 stereo pan） */
function renderTrack(tr, seconds, sr) {
  var N = Math.ceil(sr * seconds), L = new Float64Array(N), R = new Float64Array(N);
  function voice(m, when, dur, amp, kind, pan) {
    var s0 = Math.max(0, Math.floor(when * sr)), s1 = Math.min(N, Math.ceil((when + dur + 0.24) * sr));
    var f = midiHz(m), k = (1 - Math.max(0, pan)), k2 = (1 + Math.min(0, pan));
    for (var s = s0; s < s1; s++) {
      var e = envAt(kind, s / sr, when, dur, amp);
      if (e <= 0) continue;
      var v = waveSample(kind, 2 * Math.PI * f * (s / sr - when)) * e;
      L[s] += v * k; R[s] += v * k2;
    }
  }
  /* schedule()：三拍一小节，和弦在每小节第一拍起，旋律在每拍 */
  var bars = Math.ceil(seconds / (60 / tr.bpm * 3));
  for (var i = 0; i < bars * 3; i++) {
    var bar = Math.floor(i / 3) % 16, b = i % 3, c = CHORDS[tr.ch[bar]], q = 60 / tr.bpm, when = 0.08 + i * q;
    if (when > seconds + 1) break;
    if (b === 0) voice(c[0], when, q * 2.7, .12, 'harp', -.18);
    voice(c[b === 0 ? 1 : b === 1 ? 2 : 3], when + .015, q * 1.8, .075, 'harp', b === 1 ? -.32 : .28);
    if (b === 1 && bar % 4 !== 3) voice(c[1] + 12, when + q * .5, q * 1.1, .025, 'harp', .36);
    var m = tr.mel[bar][b];
    if (m > 0) {
      var ties = 0;
      for (var k2 = b + 1; k2 < 3 && tr.mel[bar][k2] === -1; k2++) ties++;
      voice(m, when, q * (ties + 1) * .87, .095, 'flute', .08);
    }
  }
  /* 主输出：music 总线增益 0.34 × 主音量 0.72，再软限幅 */
  var peak = 0, sum = 0, nz = 0;
  for (var s = 0; s < N; s++) {
    L[s] = Math.tanh(L[s] * 0.34 * 0.72); R[s] = Math.tanh(R[s] * 0.34 * 0.72);
    var v2 = Math.max(Math.abs(L[s]), Math.abs(R[s]));
    if (v2 > peak) peak = v2;
    sum += L[s] * L[s]; if (v2 > 1e-9) nz++;
  }
  return { peak: peak, rms: Math.sqrt(sum / N), nonzero: nz, len: N };
}
function renderCue(notes, seconds, sr) {
  var N = Math.ceil(sr * seconds), L = new Float64Array(N);
  notes.forEach(function (m, i) {
    var when = 0.15 + i * 0.11, dur = 0.38, amp = 0.075;
    var s0 = Math.max(0, Math.floor(when * sr)), s1 = Math.min(N, Math.ceil((when + dur + 0.24) * sr)), f = midiHz(m);
    for (var s = s0; s < s1; s++) L[s] += waveSample('harp', 2 * Math.PI * f * (s / sr - when)) * envAt('harp', s / sr, when, dur, amp);
  });
  var peak = 0, sum = 0, nz = 0;
  for (var s = 0; s < N; s++) {
    L[s] = Math.tanh(L[s] * 0.55 * 0.72);            // effects 总线 0.55
    var a = Math.abs(L[s]); if (a > peak) peak = a;
    sum += L[s] * L[s]; if (a > 1e-9) nz++;
  }
  return { peak: peak, rms: Math.sqrt(sum / N), nonzero: nz, len: N };
}

/* ---------- 从 src/audio.js 解析谱面与音效表（不硬编码，改了 audio.js 这里跟着变） ---------- */
var xhr = new XMLHttpRequest();
xhr.open('GET', CONFIG.target, false);
xhr.send(null);
var src = xhr.responseText;
var tracks = {}, cues = {}, bad = 0;
var tre = /^\s*([a-z]+):\{title:'[^']*',bpm:(\d+),ch:'([^']+)',mel:'([^']+)'\}/gm, tm;
while ((tm = tre.exec(src))) {
  tracks[tm[1]] = {
    bpm: +tm[2], ch: tm[3].split(' '),
    mel: tm[4].split('|').map(function (b) { return b.split(' ').map(Number); })
  };
}
/* vision / wheel / trial 是 Object.assign 派生出来的（换速度、换标题），
   谱面沿用主轨；不复刻这一步会漏掉三条曲目。 */
var vre = /TRACKS\.([a-z]+)\s*=\s*Object\.assign\(\{\},TRACKS\.([a-z]+),\{title:'[^']*',bpm:(\d+)\}\)/g, vm2;
while ((vm2 = vre.exec(src))) {
  var base = tracks[vm2[2]];
  if (base) tracks[vm2[1]] = { bpm: +vm2[3], ch: base.ch.slice(), mel: base.mel.map(function (r) { return r.slice(); }), derived: true };
}
var cre = /([a-z]+):\[([0-9,\s]+)\]/g, cm, cueBlock = /var cues=\{([^}]*)\}/.exec(src);
if (cueBlock) while ((cm = cre.exec(cueBlock[1]))) cues[cm[1]] = cm[2].split(',').map(Number);
Object.keys(tracks).forEach(function (k) { if (!CHORDS[tracks[k].ch[0]]) say('· 未知和弦 ' + tracks[k].ch[0] + '（' + k + '）'); });

say('audio.js ' + src.length + ' 字符；解析出配乐 ' + Object.keys(tracks).length + ' 条、音效 ' + Object.keys(cues).length + ' 个');
say('（渲染方式：按 audio.js 的 note()/schedule()/cues 逐行等价的确定性 PCM 模型，' + CONFIG.sr + 'Hz）');
say('');
say('条目'.padEnd(24) + '峰值      RMS       非零样本');

var results = [];
results.push({ name: '（基准线：什么都不播）', r: { peak: 0, rms: 0, nonzero: 0 }, baseline: true });
Object.keys(tracks).forEach(function (k) { results.push({ name: '音乐 ' + k, r: renderTrack(tracks[k], CONFIG.musicSeconds, CONFIG.sr) }); });
Object.keys(cues).forEach(function (k) { results.push({ name: '音效 ' + k, r: renderCue(cues[k], CONFIG.sfxSeconds, CONFIG.sr) }); });

results.forEach(function (x) {
  var tag = x.baseline ? '(基准)' : (x.r.peak > 0.004 ? '✓' : '✗');
  say(x.name.padEnd(24) + x.r.peak.toFixed(5).padEnd(10) + x.r.rms.toFixed(5).padEnd(10) + x.r.nonzero + '  ' + tag);
});
say('');
var base = results[0];
if (base.r.peak !== 0) { say('✗ 基准线峰值不是 0（' + base.r.peak + '）—— 测量本身有问题', 'bad'); bad++; }
else say('✓ 基准线峰值严格为 0（测量有效）', 'ok');
var silent = results.filter(function (x) { return !x.baseline && x.r.peak <= 0.004; });
if (silent.length) { say('✗ 静音条目：' + silent.map(function (x) { return x.name; }).join(' / '), 'bad'); bad += silent.length; }
else say('✓ 全部 ' + (results.length - 1) + ' 条都非静音', 'ok');
var loud = results.filter(function (x) { return !x.baseline && x.r.peak > 0.95; });
if (loud.length) { say('· 峰值过高（可能削顶）：' + loud.map(function (x) { return x.name; }).join(' / '), 'warn'); }
say(bad ? ('===== 失败：' + bad + ' 项 =====') : '===== 通过 =====');
document.title = bad ? 'FAIL' : 'PASS';
window.__autoDone = true;
(function waitDone() { if (!window.__autoDone) setTimeout(waitDone, 200); })();
</script>
</body>
</html>
