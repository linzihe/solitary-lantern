<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>bg</title>
<style>body{margin:0;background:#000}canvas{image-rendering:pixelated;display:block;width:240px;height:135px}</style></head>
<body><canvas id="c" width="480" height="270"></canvas>
<script src="../src/art-data.js"></script>
<script src="../src/art.js"></script>
<script>
var name = (/bg=([^&]+)/.exec(location.search) || [0, 'stones'])[1];
Art.loadImages(ART_DATA, function () {
  var ctx = document.getElementById('c').getContext('2d');
  ctx.imageSmoothingEnabled = false;
  Art.paintBackground(ctx, name, 12.3);
  if (/por=1/.test(location.search)) {
    ['por_keeper','por_skeptic','por_he','por_bai','por_goddess','por_god'].forEach(function (p, i) {
      var t = Art.tex(p); if (t) ctx.drawImage(t, 6 + i * 78, 140, 72, 84);
    });
  }
});
</script></body></html>
